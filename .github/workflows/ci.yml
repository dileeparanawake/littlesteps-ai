# CI on every PR: proves a merge to main (which deploys to Fly) won't break the build.
# Each job is one plain check. Deploy itself stays in fly-deploy.yml.

name: CI
on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript (no type errors)
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm exec vitest run

  docker:
    name: Production Docker build (what Fly builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
